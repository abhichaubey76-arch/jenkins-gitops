
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/abhichaubey76-arch/jenkins-gitops.git
    targetRevision: main
    path: gitops-jenkins

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-tools

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
